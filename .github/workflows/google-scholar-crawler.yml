name: Google Scholar Crawler

# Crawls the Google Scholar profile and publishes citation stats to the
# `google-scholar-stats` branch, which the homepage reads as a live badge.

on:
  push:
    branches: [ gh-pages ]
  schedule:
    - cron: '0 8 * * *'   # daily
  workflow_dispatch:        # allow manual runs

permissions:
  contents: write

jobs:
  google-scholar-crawler:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r google_scholar_crawler/requirements.txt

      - name: Crawl Google Scholar
        env:
          GOOGLE_SCHOLAR_ID: g2M2UwsAAAAJ
        run: |
          cd google_scholar_crawler
          python main.py

      - name: Publish to google-scholar-stats branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./google_scholar_crawler/results
          publish_branch: google-scholar-stats
          force_orphan: true
